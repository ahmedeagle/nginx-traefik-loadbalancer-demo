upstream backend {
    server red-app:80 max_fails=2 fail_timeout=5s;
    server blue-app:80 max_fails=2 fail_timeout=5s;
    server green-app:80 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Custom error page when all backends are down
        proxy_intercept_errors on;
        error_page 502 503 504 = @fallback;
    }
    
    location @fallback {
        return 503 '{"error": "All servers are currently down. Please try again later."}';
        add_header Content-Type application/json;
    }
}
